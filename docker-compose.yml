name: airserve

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-airserve_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airserve} -d ${POSTGRES_DB:-airserve_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airserve-net

  # ── Valkey (Redis-compatible) ────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD:-}
      --save 60 1
      --loglevel warning
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ${VALKEY_PASSWORD:+-a $VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - airserve-net

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-airserve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Console only accessible via SSH tunnel or localhost — not exposed publicly
    expose:
      - "9000"
      - "9001"
    networks:
      - airserve-net

  # ── Go backend (backend_v2) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend_v2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-airserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airserve_db}
      # Valkey
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-airserve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-airserve-media}
      # App
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEBUG: ${DEBUG:-false}
      RUN_SEED: ${RUN_SEED:-false}
      FRONTEND_BASE_URL: http://${DOMAIN:-localhost}
      # Geo
      ONEMAP_API_EMAIL: ${ONEMAP_API_EMAIL:-}
      ONEMAP_API_PASSWORD: ${ONEMAP_API_PASSWORD:-}
      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - airserve-net

  # ── React frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://${DOMAIN:-localhost}/api
      HOST: "0.0.0.0"
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - airserve-net

  # ── Caddy reverse proxy + auto-TLS ───────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - airserve-net

  # ── Adminer (DB GUI — loopback only) ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - airserve-net

  # ── Integration test runner (only started with --profile test) ───────────────
  test:
    build:
      context: ./backend_v2
      dockerfile: Dockerfile.test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    profiles:
      - test
    networks:
      - airserve-net

volumes:
  pg_data:
  valkey_data:
  minio_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  airserve-net:
    driver: bridge
